name: Build Desktop Apps

on:
  push:
    branches:
      - "electron-local"
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Python (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $zip = "python-embed.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Path Python | Out-Null
          Expand-Archive -Path $zip -DestinationPath Python
          # Enable site-packages in embedded Python
          Add-Content -Path Python\python311._pth -Value "`r`nLib\site-packages"
          (Get-Content Python\python311._pth) -replace "#import site", "import site" | Set-Content Python\python311._pth

      # Build per platform. Uses your package.json build config.
      - name: Build
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exemplify-${{ matrix.os }}
          path: dist/**
